name: run-tests

on:
  push:
    branches: [main, v2-modernize]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        stability: [prefer-stable]
        include:
          - php: '8.4'
            stability: prefer-lowest
    name: PHP ${{ matrix.php }} / Laravel 13 / ${{ matrix.stability }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
      - run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction
      - run: composer show -D
      - run: vendor/bin/pest --ci
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- dist/output.css
